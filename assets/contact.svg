<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Got an idea? Let's ship it. Open to internships, collaborations and interesting projects.">
<title>Got an idea? Let's ship it. Open to internships, collaborations and interesting projects.</title>
<defs>
<style>@font-face{font-family:'sn-serif';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'sn-italic';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'sn-mono';src:url(data:font/woff2;base64,) format('woff2');}
.s{font-family:'sn-serif',Georgia,serif;} .i{font-family:'sn-italic',Georgia,serif;font-style:italic;} .m{font-family:'sn-mono',ui-monospace,monospace;text-transform:uppercase;}
.p{fill:#ECEDE6;} .mu{fill:#8A8C86;} .a{fill:#3DDC84;} .k{fill:#0C0D0C;}
.ln{stroke:#262825;stroke-width:1;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
@keyframes tick{to{transform:translateX(var(--tw));}}
@keyframes lit{0%,22%{fill:#3DDC84;}25%,100%{fill:#ECEDE6;}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="1200" height="420" fill="#0C0D0C"/>
<text x="48.0" y="60.0" class="m mu" font-size="14" text-anchor="start" letter-spacing="1.5">(04) Say hello</text>
<text x="1152.0" y="60.0" class="m mu" font-size="14" text-anchor="end" letter-spacing="1.5">Open to internships &amp; collabs</text>
<line x1="48" y1="84" x2="1152" y2="84" class="ln"/>
<text x="44.0" y="236.0" class="s p" font-size="140" text-anchor="start">Got an idea?</text>
<text x="44.0" y="372.0" class="i p" font-size="140" text-anchor="start">let’s ship it</text>
<text x="568.2" y="372.0" class="i a" font-size="140" text-anchor="start" style="animation:blink 1.1s steps(1) infinite">.</text>
<path d="M 1040 150 C 1059.2 250.8 1059.2 250.8 1160 270 C 1059.2 289.2 1059.2 289.2 1040 390 C 1020.8 289.2 1020.8 289.2 920 270 C 1020.8 250.8 1020.8 250.8 1040 150 Z" class="a" style="animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center;"/>
<rect width="1200" height="420" filter="url(#g)" opacity=".06"/>
</svg>
